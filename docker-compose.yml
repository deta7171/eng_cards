services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eng_cards
      POSTGRES_PASSWORD: eng_cards
      POSTGRES_DB: eng_cards
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eng_cards"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://eng_cards:eng_cards@db:5432/eng_cards
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  db_data:
